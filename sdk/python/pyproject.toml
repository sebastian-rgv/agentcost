[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcost"
version = "1.2.0"
description = "Report LLM usage and gate agent spending from Python (same store as the agentcost CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["agentcost"]
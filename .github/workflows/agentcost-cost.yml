name: cost-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agentcost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: agentcost cost guard
        uses: ./.github/actions/agentcost-cost
        with:
          threshold: "20"
          baseline-file: ".agentcost-baseline.json"
name: "agentcost cost guard"
description: "Fail CI when the estimated LLM cost rises more than a threshold versus a committed baseline."
inputs:
  threshold:
    description: "Maximum allowed % increase versus the baseline (e.g. 20)"
    required: false
    default: "20"
  baseline-file:
    description: "Path to the committed baseline JSON (relative to the repo root)"
    required: false
    default: ".agentcost-baseline.json"
  project:
    description: "Optional project name to scope the cost check"
    required: false
    default: ""
  write-baseline:
    description: "Set to 'true' to update the baseline file with the current cost on success"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Install agentcost"
      shell: bash
      run: npm install -g agentcost@latest

    - name: "Aggregate current costs"
      shell: bash
      id: current
      env:
        PROJECT: ${{ inputs.project }}
        BASELINE: ${{ inputs.baseline-file }}
        THRESHOLD: ${{ inputs.threshold }}
      run: |
        set -euo pipefail
        AGENTCOST_HOME="$RUNNER_TEMP/agentcost" agentcost report --period all --project "$PROJECT" --json > "$RUNNER_TEMP/current.json"
        CURRENT_TOTAL=$(node -e "const r=require('$RUNNER_TEMP/current.json'); console.log(r.total.cost ?? 0)")
        node - "$CURRENT_TOTAL" "$THRESHOLD" "$BASELINE" <<'EOF'
const [total, threshold, baselineFile] = process.argv.slice(2);
const fs = require("fs");
const current = parseFloat(total);
const baseline = fs.existsSync(baselineFile)
  ? parseFloat(fs.readFileSync(baselineFile, "utf8"))
  : 0;
const increase = baseline > 0 ? ((current - baseline) / baseline) * 100 : 0;
console.log(`agentcost cost guard: current=$${current.toFixed(4)} baseline=$${baseline.toFixed(4)} change=${increase.toFixed(2)}%`);
if (increase > parseFloat(threshold)) {
  console.log(`::error::Estimated LLM cost increased ${increase.toFixed(2)}% (> ${threshold}%). Approve the increase and update the baseline.`);
  process.exit(1);
}
EOF

    - name: "Update baseline (on success)"
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline-file }}
        WRITE_BASELINE: ${{ inputs.write-baseline }}
      run: |
        if [ "$WRITE_BASELINE" = "true" ]; then
          node -e "const r=require('$RUNNER_TEMP/current.json'); require('fs').writeFileSync('$BASELINE', String(r.total.cost ?? 0))"
        fi